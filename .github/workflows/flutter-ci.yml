name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # iOS-only tree; generate Android in CI so ubuntu can prove a compile
      # without macos-latest. No signing or store upload.
      - name: Enable Android platform
        run: flutter create . --platforms=android --project-name scripture_up --org com.narrowroad

      - name: Build APK
        run: flutter build apk --debug
