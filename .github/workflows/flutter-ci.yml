name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    # Scripture Up ships on iOS only, so CI compiles the iOS app (Swift
    # AppDelegate channel, Podfile, deployment target). Public repo: macOS
    # minutes are free. No signing or store upload.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build iOS (debug, no codesign)
        run: flutter build ios --debug --no-codesign

      # Size/bloat gate (nr-hub DECISIONS 2026-11-11 §2): print the Runner.app
      # size and fail past the budget. Raise the budget on purpose, not by accident.
      - name: App size budget
        run: |
          app=build/ios/iphoneos/Runner.app
          kb=$(du -sk "$app" | cut -f1)
          budget_kb=${APP_BUDGET_KB}
          echo "Runner.app (debug): ${kb} KB (budget ${budget_kb} KB)"
          test "$kb" -le "$budget_kb"
        env:
          APP_BUDGET_KB: "400000"
