# Patrick 11/12: weekly, grouped, at most 3 open Dependabot PRs per repo.
# open-pull-requests-limit is per ecosystem, so the limits below add up to 3.
# Minor/patch auto-merge on green CI (.github/workflows/dependabot-auto-merge.yml).
# Major bumps never auto-merge; they wait for an independent review.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
