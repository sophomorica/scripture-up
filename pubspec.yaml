name: scripture_up
description: Forehead party game for scripture references.
publish_to: "none"
version: 1.1.0+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.5.1
  camera: ^0.12.1
  path_provider: ^2.1.6
  sensors_plus: ^7.1.0
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/decks/
    - assets/sounds/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
        - asset: assets/fonts/Fraunces-Italic.ttf
          style: italic
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/BarlowCondensed-Black.ttf
          weight: 900
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
